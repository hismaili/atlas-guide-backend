spring:
  cloud:
    vault:
      enabled: false
  virtual-thread:
    enabled: true
  config:
    import: optional:vault://kv-tours/backend/${environment}/ai-config,optional:vault://kv-tours/backend/${environment}/database
  ai:
    chat:
      client:
        enabled: false
  # Datasource configuration
  datasource:
    url: ${DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: ${show_sql:false}
    hibernate:
      ddl-auto: ${ddl-auto:update} # Use 'update' or 'validate' in production
    properties:
      hibernate:
        format_sql: ${format_sql:false}
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: ${batch_size:50}
        batch_versioned_data: true
  security:
    oauth2:
      resourceserver:
        jwt:
          audience: tours-advisor-mobile
          issuer-uri: http://localhost:8080/realms/tours-advisor

springdoc:
  swagger-ui:
    oauth-config:
      authorization-url: http://localhost:8080/realms/tours-advisor/protocol/openid-connect/auth
      token-url: http://localhost:8080/realms/tours-advisor/protocol/openid-connect/token
      client-id: tours-advisor-mobile