spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${api-key}
spring.ai.vertex.ai.gemini.transport=REST
#spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.max-output-tokens=12000
spring.ai.google.genai.chat.options.thinking-level=HIGH